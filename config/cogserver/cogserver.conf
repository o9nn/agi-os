# ============================================================================
# AGI-OS CogServer Configuration
# ============================================================================
# CogServer provides a network-accessible Guile/Scheme shell for interacting
# with the AtomSpace knowledge graph, plus module loading for PLN reasoning,
# ECAN attention, and KoboldCpp cognitive LLM inference.
#
# Start: cogserver -c config/cogserver/cogserver.conf
# Connect: rlwrap telnet localhost 17001
# ============================================================================

# Network settings
SERVER_PORT           = 17001
LOG_FILE              = /tmp/cogserver.log
LOG_LEVEL             = info
BACK_LOG              = 100
SERVER_THREADS        = 4

# Prompt for the Guile shell
PROMPT                = "agi-os> "
ANSI_ENABLED          = true

# AtomSpace configuration
ATOMSPACE_TYPE        = default

# ============================================================================
# Module Loading Order
# ============================================================================
# Modules are loaded in dependency order. The CogServer shell provides
# access to all loaded modules via Guile Scheme.

# Core modules
MODULES               = opencog/cogserver/modules/libbuiltinreqs.so,
                         opencog/cogserver/modules/libSchemeShell.so

# ============================================================================
# Scheme Module Paths
# ============================================================================
# These paths are added to Guile's %load-path so that (use-modules ...)
# can find AGI-OS Scheme modules.

SCM_PRELOAD           = config/cogserver/agi-os-init.scm
